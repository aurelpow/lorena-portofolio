title: "Lorena Patri"
description: "C&B Analyst · Compensación & Benefits · Madrid"
baseurl: "/lorena-portofolio"
url: "https://aurelpow.github.io"
markdown: kramdown
highlighter: rouge
profile_photo: true
collections:
