      lang: en
  - scope:
      path: "_projects"
    values:
      lang: es

exclude:
  - CLAUDE.md
  - lorena_patri_portfolio.html
  - prompts/
  - docs/
  - Gemfile
  - Gemfile.lock
  - vendor/
