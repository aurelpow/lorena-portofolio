{% if jekyll.environment == "production" and site.google_analytics and site.google_analytics != "" %}
{% assign lang = page.lang | default: "es" %}
{% assign t = site.data.i18n[lang] %}
<div class="cookie-banner" id="cookie-banner" role="dialog" aria-live="polite" aria-label="{{ t.cookies.aria_label }}" hidden>
  <p class="cookie-text">{{ t.cookies.message }}</p>
  <div class="cookie-actions">
    <button class="cookie-btn cookie-reject" type="button">{{ t.cookies.reject }}</button>
    <button class="cookie-btn cookie-accept" type="button">{{ t.cookies.accept }}</button>
  </div>
</div>
<script>
(function(){
  var el = document.getElementById('cookie-banner');
  if (!el) return;

  var stored;
  try { stored = localStorage.getItem('cookie-consent'); } catch(e) {}
  if (stored === 'granted' || stored === 'denied') return;

  el.hidden = false;
  requestAnimationFrame(function(){ el.classList.add('visible'); });

  function decide(value){
    try { localStorage.setItem('cookie-consent', value); } catch(e) {}
    if (value === 'granted' && window.loadAnalytics) window.loadAnalytics();
    el.classList.remove('visible');
    setTimeout(function(){ el.hidden = true; }, 300);
  }

  el.querySelector('.cookie-accept').addEventListener('click', function(){ decide('granted'); });
  el.querySelector('.cookie-reject').addEventListener('click', function(){ decide('denied'); });
})();
</script>
{% endif %}
